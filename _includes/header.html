<header class="site-header">
  <div class="container header-container">
    <a href="{{ '/' | relative_url }}" class="logo-brand">
      Swift<span class="logo-accent">Web</span>Sync
    </a>

    <!-- Desktop & Mobile Navigation Links -->
    <nav class="site-nav" id="siteNav">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
      <a href="{{ '/work/' | relative_url }}" {% if page.url == '/work/' %}class="active"{% endif %}>Our Work</a>
      <a href="{{ '/services/' | relative_url }}" {% if page.url == '/services/' %}class="active"{% endif %}>Services</a>
      <a href="{{ '/industries/restaurants/' | relative_url }}" {% if page.url == '/industries/restaurants/' %}class="active"{% endif %}>Restaurants</a>
      <a href="{{ '/industries/saloons/' | relative_url }}" {% if page.url == '/industries/saloons/' %}class="active"{% endif %}>Salons</a>
      <a href="{{ '/faq/' | relative_url }}" {% if page.url == '/faq/' %}class="active"{% endif %}>FAQ</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}class="active"{% endif %}>About</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.url == '/blog/' or page.url contains '/blog/' %}class="active"{% endif %}>Blog</a>
      <a href="{{ '/contact/' | relative_url }}" class="nav-cta-btn" {% if page.url == '/contact/' %}style="opacity: 0.9;"{% endif %}>Start Project</a>
    </nav>

    <!-- Mobile Menu Hamburger Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle Navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

<script>
  // Simple vanilla JS toggle for mobile drawer menu
  const toggleBtn = document.getElementById('mobileMenuToggle');
  const siteNav = document.getElementById('siteNav');
  
  if (toggleBtn && siteNav) {
    toggleBtn.addEventListener('click', () => {
      toggleBtn.classList.toggle('active');
      siteNav.classList.toggle('active');
    });
  }
</script>
